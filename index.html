<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>qwerty — студия для игр</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#171230;--pan:#241d47;--pan2:#33296a;--ln:#4a3f9a;--ink:#f3efff;--mut:#a9a1d8;--ac:#5ef2c1;--ac2:#ffd36b;--bad:#ff7b8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 15px/1.35 Nunito,system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:var(--pan2);border-radius:12px;padding:9px 12px;cursor:pointer}
button:active{transform:scale(.96)}
button.on{background:var(--ac);color:#0f2a22}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=text]{background:#171230;color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:8px;font:inherit;width:100px}
select{background:var(--pan2);color:var(--ink);border:0;border-radius:10px;padding:8px;font:inherit}
h1,h2,h3{font-family:Unbounded,system-ui,sans-serif;margin:0}
/* HOME */
#home{position:fixed;inset:0;overflow:auto;padding:max(22px,env(safe-area-inset-top)) 18px 30px;background:radial-gradient(120% 70% at 85% -10%,#4b2fb0 0,#171230 60%)}
#home h1{font-size:44px;letter-spacing:-1px}
#home .sub{color:var(--mut);margin:6px 0 22px;max-width:30ch}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px}
.hc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 14px 16px;border-radius:22px;text-align:left;min-height:170px;color:#14102c}
.hc svg{width:54px;height:54px}
.hc b{font:700 18px Unbounded,system-ui}
.hc span{font-size:13px;font-weight:600;opacity:.8}
.hc.c1{background:#5ef2c1}.hc.c2{background:#ffd36b}.hc.c3{background:#7cc4ff}.hc.c4{background:#ff9fc0}
.fine{margin-top:22px;color:var(--mut);font-size:13px;max-width:44ch}
.fine button{background:none;color:var(--ac);padding:0;text-decoration:underline}
/* EDITOR */
#ed{position:fixed;inset:0;display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:max(8px,env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#171230d0,#17123000);pointer-events:none}
#top>*{pointer-events:auto}
#top button{padding:8px 10px;background:#241d47e6}
#modes{display:flex;gap:3px;background:#241d47e6;border-radius:14px;padding:3px;flex:1;min-width:0}
#modes button{flex:1;padding:7px 2px;font-size:13px;background:none;min-width:0}
#modes button.on{background:var(--ac)}
#tools{position:absolute;left:8px;top:62px;display:flex;flex-direction:column;gap:6px}
.tb{width:54px;padding:6px 0;background:#241d47e6;display:flex;flex-direction:column;align-items:center;gap:0;font-size:20px;line-height:1.1}
.tb i{font:700 10px Nunito;font-style:normal;color:var(--mut)}
.tb.on i{color:#0f2a22}
#selbar{position:absolute;top:62px;right:8px;display:none;gap:5px;align-items:center;background:#241d47ee;padding:6px;border-radius:14px;max-width:calc(100% - 80px);flex-wrap:wrap;justify-content:flex-end}
#selbar b{font-size:13px;padding:0 6px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#selbar button{padding:6px 9px}
#dock{position:absolute;left:0;right:0;bottom:0;background:var(--pan);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0008;padding-bottom:env(safe-area-inset-bottom)}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 8px 4px}
#tabs button{flex:0 0 auto;display:flex;gap:5px;align-items:center;background:none;padding:7px 10px;font-size:14px}
#tabs button.on{background:var(--pan2);color:var(--ac)}
#pb{max-height:34vh;overflow:auto;padding:4px 12px 14px}
#dock.min #pb{display:none}
.tp{display:none}.tp.on{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chips button{padding:7px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;font-size:13px}
.card span{font-size:26px}
.card i{font:600 10px Nunito;font-style:normal;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row>label{flex:1;min-width:120px}
.note{color:var(--mut);font-size:13px;margin:8px 0}
.lr{display:flex;gap:6px;align-items:center;background:#1b1538;border-radius:12px;padding:6px 8px;margin:6px 0}
.lr.act{outline:2px solid var(--ac)}
.lr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr button{padding:6px 9px;font-size:13px}
.wheelbox{position:relative;width:200px;height:200px;margin:6px auto;touch-action:none}
#wheel{width:200px;height:200px;border-radius:50%;display:block}
#wm{position:absolute;width:22px;height:22px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000a;transform:translate(-50%,-50%);pointer-events:none}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sw button{width:32px;height:32px;padding:0;border-radius:10px;border:2px solid #ffffff30}
#prev{width:44px;height:44px;border-radius:12px;border:2px solid #fff}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.keys button{padding:5px 9px;font-size:13px}
.keys button.on{background:var(--ac2);color:#2a2000}
#guide{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.gc{background:var(--pan);border-radius:24px;padding:20px;max-width:420px;width:100%;border:2px solid var(--ac)}
.gc h3{font-size:19px;margin:6px 0 8px}.gc p{margin:0 0 16px;line-height:1.45}
.gstep{color:var(--ac2);font-size:13px}
.grow{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000c;padding:9px 14px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:88%;text-align:center;font-size:14px}
</style></head><body>

<div id="home">
  <h1>qwerty</h1>
  <p class="sub">Студия для игр: сделай героя, вещь, место — и оживи их.</p>
  <div class="cards">
    <button class="hc c1" data-m="char"><svg viewBox="0 0 64 64" fill="none" stroke="#14102c" stroke-width="4" stroke-linecap="round"><circle cx="32" cy="14" r="8"/><path d="M32 24v20M32 30L18 38M32 30l14 8M32 44l-10 16M32 44l10 16"/></svg><b>Персонаж</b><span>Фигурки, кисть, краска, суставы</span></button>
    <button class="hc c2" data-m="item"><svg viewBox="0 0 64 64" fill="none" stroke="#14102c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M44 8l12 12-26 26-12-12zM14 38l-6 14 14-6M34 42l6 6"/></svg><b>Предмет</b><span>Мечи, сундуки, зелья из фигур и кисти</span></button>
    <button class="hc c3" data-m="loc"><svg viewBox="0 0 64 64" fill="none" stroke="#14102c" stroke-width="4" stroke-linejoin="round"><path d="M8 58V28h14v30M22 58V12h20v46M42 58V34h14v24M28 22h8M28 32h8M28 42h8"/></svg><b>Локация</b><span>Город, авто, трубы, облака, природа</span></button>
    <button class="hc c4" data-m="anim"><svg viewBox="0 0 64 64" fill="none" stroke="#14102c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><rect x="6" y="12" width="52" height="40" rx="8"/><path d="M27 23l12 9-12 9z"/><path d="M14 58h36"/></svg><b>Анимация</b><span>Кадры, ходьба, встроенные движения</span></button>
  </div>
  <p class="fine">Готовое можно выгрузить в игру файлом .glb.<br><button id="resetg">Показать подсказки заново</button></p>
</div>

<div id="ed">
  <canvas id="cv"></canvas>
  <div id="top">
    <button id="bhome">⌂</button>
    <div id="modes"></div>
    <button id="bundo">↶</button><button id="bhelp">?</button><button id="bexp">⬇</button>
  </div>
  <div id="tools"></div>
  <div id="selbar"></div>
  <div id="dock"><div id="tabs"></div><div id="pb"></div></div>
</div>
<div id="guide"></div><div id="toast"></div>
<input type="file" id="file" accept=".glb,.gltf" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function toast(m,ms=2400){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,ms)}
if(!window.THREE){document.body.insertAdjacentHTML('afterbegin','<p style="position:fixed;z-index:99;top:0;background:#c33;padding:10px">Не загрузилась 3D-библиотека. Проверь интернет и обнови страницу.</p>');return}
const T=THREE;

/* ---------- состояние ---------- */
const MODES={
 char:{t:'Персонаж',s:'Перс.',tabs:['lib','color','brush','shape','layers','light'],cat:'chars'},
 item:{t:'Предмет',s:'Предм.',tabs:['shape','brush','color','layers','lib','light'],cat:'items'},
 loc:{t:'Локация',s:'Лок.',tabs:['lib','shape','color','layers','light','brush'],cat:'city'},
 anim:{t:'Анимация',s:'Аним.',tabs:['anim','lib','layers','light'],cat:'chars'}};
const TABS={lib:['📦','Библиотека'],shape:['🔷','Фигуры'],brush:['🖌','Кисть'],color:['🎨','Цвет'],layers:['🗂','Слои'],light:['💡','Свет'],anim:['🎞','Кадры']};
const PRE=[
 {n:'Студия',bg:'#2b2552',sky:'#ffffff',gr:'#7f77b5',sun:'#fff6e0',int:1.3,hemi:.8,az:40,el:55,gc:'#3a3370'},
 {n:'День',bg:'#8fd1ff',sky:'#ffffff',gr:'#8a9a6a',sun:'#fff2d6',int:1.7,hemi:.7,az:60,el:60,gc:'#6fae5a'},
 {n:'Закат',bg:'#ff9e6b',sky:'#ffd9b0',gr:'#6a4a7a',sun:'#ff7d3a',int:1.5,hemi:.5,az:200,el:14,gc:'#7a5a5a'},
 {n:'Ночь',bg:'#0e0b22',sky:'#4a5aa8',gr:'#1a1536',sun:'#8fb0ff',int:.6,hemi:.45,az:120,el:40,gc:'#1f1b3c'}];
const st={mode:'char',tool:'select',last:'brush',tab:'lib',cat:'chars',size:.45,hsv:[190,.6,1],recent:[],
 layers:[{id:1,name:'Слой 1',merge:true,vis:true}],layer:1,nid:2,press:true,smooth:.25,gm:'translate',
 dur:4,Tm:0,playing:false,loop:true,keys:[],light:Object.assign({},PRE[0]),shadow:true,ground:true,grid:true,joints:false};
const items=[],strokes=[],undoS=[];let sel=null;

/* ---------- сцена ---------- */
const cv=$('#cv'),renderer=new T.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;
const scene=new T.Scene();scene.background=new T.Color(st.light.bg);
const camera=new T.PerspectiveCamera(50,1,.05,400);camera.position.set(3.2,2.4,4.2);
const controls=new T.OrbitControls(camera,cv);controls.target.set(0,.9,0);controls.maxPolarAngle=Math.PI*.52;controls.enableDamping=false;
const hemi=new T.HemisphereLight(0xffffff,0x7f77b5,.8);scene.add(hemi);
const sun=new T.DirectionalLight(0xffffff,1.3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:60});sun.shadow.bias=-.0005;scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:0x3a3370,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.userData.ground=true;scene.add(ground);
const grid=new T.GridHelper(40,40,0x7a6fe0,0x453f8c);grid.position.y=.002;scene.add(grid);
const tc=new T.TransformControls(camera,cv);tc.setSize(1.1);scene.add(tc);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

function applyLight(){const L=st.light;scene.background.set(L.bg);hemi.color.set(L.sky);hemi.groundColor.set(L.gr);hemi.intensity=L.hemi;
 sun.color.set(L.sun);sun.intensity=L.int;const a=L.az*Math.PI/180,e=L.el*Math.PI/180;
 sun.position.set(Math.cos(a)*Math.cos(e)*16,Math.sin(e)*16,Math.sin(a)*Math.cos(e)*16);
 sun.castShadow=st.shadow;ground.visible=st.ground;grid.visible=st.grid;ground.material.color.set(L.gc)}

/* ---------- цвет ---------- */
function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return[f(5),f(3),f(1)]}
function rgb2hsv(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
const curColor=()=>{const[r,g,b]=hsv2rgb(...st.hsv);return new T.Color(r,g,b)};
const curHex=()=>'#'+curColor().getHexString();
function useColor(){const h=curHex();if(!st.recent.includes(h)){st.recent.unshift(h);st.recent=st.recent.slice(0,10);renderSw()}}

/* ---------- мелкие помощники для моделей ---------- */
const B=(w,h,d)=>new T.BoxGeometry(w,h,d),S=(r,a=16,b=12)=>new T.SphereGeometry(r,a,b),C=(rt,rb,h,s=14)=>new T.CylinderGeometry(rt,rb,h,s);
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.7,metalness:.05});
function part(g,c,x=0,y=0,z=0,name='часть'){const m=new T.Mesh(g,mat(c));m.position.set(x,y,z);m.userData.part=name;return m}
function joint(key,x,y,z,parent,label){const j=new T.Group();j.name=key;j.position.set(x,y,z);j.userData.joint=true;j.userData.label=label||key;parent&&parent.add(j);return j}
const metal=(m,c,mt=.7,r=.35)=>{m.material.color.set(c);m.material.metalness=mt;m.material.roughness=r;return m};
const glow=(m,c,i=1)=>{m.material.emissive.set(c);m.material.emissiveIntensity=i;return m};
function wtex(cols,rows){const c=document.createElement('canvas');c.width=cols*16;c.height=rows*16;const x=c.getContext('2d');x.fillStyle='#6d6a8c';x.fillRect(0,0,c.width,c.height);
 for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){x.fillStyle=Math.random()<.4?'#ffe38a':'#232b4a';x.fillRect(i*16+3,j*16+3,10,10)}
 const t=new T.CanvasTexture(c);t.magFilter=T.NearestFilter;return t}

/* ---------- встроенные модели (работают без интернета) ---------- */
function human(ch){const lg=ch?.4:.82,tr=ch?.36:.62,hr=ch?.33:.2,al=ch?.34:.6,g=new T.Group(),skin=0xf2c9a5,pants=0x35408f;g.userData.walkType='human';
 const hips=joint('hips',0,lg,0,g,'Таз');hips.add(part(B(.4,.2,.24),pants,0,0,0,'штаны'));
 const sp=joint('spine',0,.08,0,hips,'Позвоночник');sp.add(part(B(.42,tr,.25),0xe0527a,0,tr/2,0,'майка'));
 const hd=joint('head',0,tr+.03,0,sp,'Голова');hd.add(part(S(hr),skin,0,hr,0,'голова'));
 hd.add(part(new T.SphereGeometry(hr*1.07,18,10,0,Math.PI*2,0,Math.PI*.58),0x3b2519,0,hr*1.02,-.005,'волосы'));
 [-1,1].forEach(s=>hd.add(part(S(hr*.1,8,6),0x14102c,s*hr*.36,hr*1.05,hr*.92,'глаз')));
 [[-1,'L','Лев.'],[1,'R','Прав.']].forEach(([s,k,r])=>{
  const a=joint('arm'+k,s*.27,tr-.05,0,sp,r+' плечо');a.add(part(C(.06,.055,al*.5,10),skin,0,-al*.25,0,'рука'));
  const e=joint('el'+k,0,-al*.5,0,a,r+' локоть');e.add(part(C(.055,.045,al*.5,10),skin,0,-al*.25,0,'предплечье'));e.add(part(S(.06),skin,0,-al*.52,0,'кисть'));
  const l=joint('leg'+k,s*.11,-.08,0,hips,r+' бедро');l.add(part(C(.08,.07,lg*.5,10),pants,0,-lg*.25,0,'штанина'));
  const kn=joint('knee'+k,0,-lg*.5,0,l,r+' колено');kn.add(part(C(.07,.06,lg*.5,10),pants,0,-lg*.25,0,'штанина'));kn.add(part(B(.13,.07,.24),0x2a2a33,0,-lg*.5,.05,'ботинок'))});
 return g}
function quad(type){const P={cat:{c:0xe9a54b,bl:.62,bh:.26,bw:.26,lg:.3,hr:.16,tl:.55,ear:'pt',tc:0xe9a54b},dog:{c:0xc9985f,bl:.85,bh:.32,bw:.32,lg:.42,hr:.2,tl:.45,ear:'fl',tc:0xc9985f},fox:{c:0xe56a22,bl:.74,bh:.27,bw:.27,lg:.36,hr:.17,tl:.7,ear:'pt',tc:0xfff1e0}}[type];
 const g=new T.Group(),{bl,bh,bw,lg,hr}=P;g.userData.walkType='quad';
 const body=joint('spine',0,lg+bh*.4,0,g,'Тело');body.add(part(B(bw,bh,bl),P.c,0,0,0,'тело'));
 const hd=joint('head',0,bh*.3,bl/2,body,'Голова');hd.add(part(S(hr),P.c,0,hr*.4,hr*.5,'голова'));
 hd.add(part(B(hr*.9,hr*.6,hr*.9),type==='fox'?0xfff1e0:P.c,0,hr*.2,hr*1.3,'морда'));hd.add(part(S(hr*.14,8,6),0x14102c,0,hr*.34,hr*1.78,'нос'));
 [-1,1].forEach(s=>{hd.add(part(S(hr*.12,8,6),0x14102c,s*hr*.42,hr*.62,hr*1.15,'глаз'));
  const ear=P.ear==='pt'?part(new T.ConeGeometry(hr*.38,hr*.8,4),P.c,s*hr*.5,hr*1.25,hr*.3,'ухо'):part(B(hr*.3,hr*.7,hr*.12),0x7a5530,s*hr*.95,hr*.75,hr*.4,'ухо');
  if(P.ear==='fl')ear.rotation.z=s*.35;hd.add(ear)});
 if(type==='cat')[-1,1].forEach(s=>[0,1,2].forEach(k=>{const w=part(C(.004,.004,.24,4),0xf3efff,s*.12,hr*.2+(k-1)*.025,hr*1.7,'ус');w.rotation.z=Math.PI/2+(k-1)*.18*s;hd.add(w)}));
 const t1=joint('tail1',0,bh*.2,-bl/2,body,'Хвост 1');t1.rotation.x=-1;t1.add(part(C(.045,.04,P.tl*.5,8),P.c,0,P.tl*.25,0,'хвост'));
 const t2=joint('tail2',0,P.tl*.5,0,t1,'Хвост 2');t2.rotation.x=.5;t2.add(part(C(.04,.03,P.tl*.5,8),P.tc,0,P.tl*.25,0,'кончик хвоста'));
 [['FL',-1,1],['FR',1,1],['BL',-1,-1],['BR',1,-1]].forEach(([n,sx,sz])=>{const l=joint('leg'+n,sx*bw*.38,lg,sz*bl*.36,body.parent===g?g:body,'Лапа '+n);
  l.position.set(sx*bw*.38,-bh*.4,sz*bl*.36);l.add(part(C(.05,.04,lg,10),P.c,0,-lg/2,0,'нога'));l.add(part(S(.06),type==='fox'?0x2a2a33:0xf3e6d0,0,-lg,.02,'лапа'));body.add(l)});
 return g}
function sword(){const g=new T.Group();g.add(metal(part(B(.1,1,.025),0xd8e2ee,0,.7,0,'лезвие'),0xd8e2ee));
 const tip=part(new T.ConeGeometry(.07,.16,4),0xd8e2ee,0,1.28,0,'остриё');tip.rotation.y=Math.PI/4;tip.scale.z=.3;g.add(metal(tip,0xd8e2ee));
 g.add(metal(part(B(.42,.07,.09),0xe0b04a,0,.17,0,'гарда'),0xe0b04a));g.add(part(C(.035,.035,.32,10),0x6b3a22,0,-.01,0,'рукоять'));g.add(metal(part(S(.065),0xe0b04a,0,-.2,0,'навершие'),0xe0b04a));return g}

/* ---------- кисть ---------- */
const CAP=3000,gHi=S(1,10,8),gLo=S(1,6,5),dummy=new T.Object3D();
const rad=()=>.003*Math.pow(200,st.size),sizeFor=r=>Math.log(r/.003)/Math.log(200);
function newStroke(color){const m=new T.InstancedMesh(rad()<.02?gLo:gHi,new T.MeshStandardMaterial({color,roughness:.55}),CAP);m.count=0;m.frustumCulled=false;m.castShadow=m.receiveShadow=true;
 const L=st.layers.find(l=>l.id===st.layer);m.userData={stroke:true,layer:st.layer};m.visible=L.vis;scene.add(m);return m}
function addSphere(s,p,r){const i=s.count;if(i>=CAP)return false;dummy.position.copy(p);dummy.scale.setScalar(r);dummy.updateMatrix();s.setMatrixAt(i,dummy.matrix);s.count=i+1;s.instanceMatrix.needsUpdate=true;return true}
const ray=new T.Raycaster(),ndc=new T.Vector2(),pl=new T.Plane();
function setRay(e){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera)}
function pickables(){const a=[];if(ground.visible)a.push(ground);items.forEach(it=>it.traverse(o=>{if((o.isMesh||o.isInstancedMesh)&&o.visible&&!o.userData.marker)a.push(o)}));return a}
function hit(){const h=ray.intersectObjects(pickables(),false)[0];if(!h)return null;const n=h.face?h.face.normal.clone().transformDirection(h.object.matrixWorld):new T.Vector3(0,1,0);return{p:h.point.clone(),n,o:h.object,f:h.face}}
function markerHit(){const ms=[];items.forEach(it=>it.traverse(o=>{if(o.userData.marker&&o.visible)ms.push(o)}));const h=ray.intersectObjects(ms,false)[0];return h?h.object.parent:null}
let cur=null,pointers=new Set(),down=null;
function samplePoint(){const h=hit();if(h)return h;const dir=new T.Vector3();camera.getWorldDirection(dir);pl.setFromNormalAndCoplanarPoint(dir,cur&&cur.last?cur.last:controls.target);const p=new T.Vector3();return ray.ray.intersectPlane(pl,p)?{p,n:null,o:null}:null}
function brushStart(e){setRay(e);const s=samplePoint();if(!s)return;const L=st.layers.find(l=>l.id===st.layer);if(!L.vis){toast('Этот слой скрыт — включи глазик во вкладке «Слои»');return}
 cur={s:newStroke(curColor()),paint:st.tool==='paint',merge:L.merge,target:s.o,last:null,filt:null};useColor();brushAdd(e,s)}
function brushAdd(e,s){if(!cur)return;let r=rad();if(e.pointerType==='pen'&&st.press)r*=.2+.8*(e.pressure||.5);
 let p=s.p.clone();if(s.n)p.addScaledVector(s.n,cur.paint?-r*.75:r*.3);
 if(cur.filt&&st.smooth>0)p=cur.filt.clone().lerp(p,1-st.smooth);cur.filt=p.clone();
 if(!cur.last){addSphere(cur.s,p,r);cur.last=p;return}
 const d=p.distanceTo(cur.last),step=Math.max(r*.4,.0015),n=Math.min(Math.ceil(d/step),80);
 for(let k=1;k<=n;k++){const q=cur.last.clone().lerp(p,k/n);if(!addSphere(cur.s,q,r)){const c=cur;brushEnd();cur={s:newStroke(curColor()),paint:c.paint,merge:c.merge,target:c.target,last:q,filt:q.clone()};addSphere(cur.s,q,r)}}
 cur.last=p}
function brushEnd(){if(!cur)return;const c=cur;cur=null;if(!c.s.count){scene.remove(c.s);return}const s=c.s;strokes.push(s);
 if(c.merge&&c.target){let t=c.target;if(t.isInstancedMesh&&t.parent&&t.parent!==scene)t=t.parent;
  if(t.isSkinnedMesh){let best=1e9,bb=null;const w=new T.Vector3(),sp=s.position.clone();s.updateMatrixWorld(true);const sw=new T.Vector3().setFromMatrixPosition(s.matrixWorld);
   const bx=new T.Box3().setFromObject(s);bx.getCenter(sp);t.skeleton.bones.forEach(b=>{b.getWorldPosition(w);const d=w.distanceTo(sp);if(d<best){best=d;bb=b}});if(bb)t=bb}
  if(t&&t!==s){t.attach(s);s.userData.mergedTo=t.name||'part'}push(()=>{if(s.parent)s.parent.remove(s);const i=strokes.indexOf(s);if(i>=0)strokes.splice(i,1)})}
 else{s.userData.isItem=true;s.userData.name='Мазок '+(items.length+1);items.push(s);push(()=>removeItem(s,true))}
 renderAll()}

/* ---------- инструменты по касанию ---------- */
function matAt(h){const m=h.o.material;return Array.isArray(m)?m[h.f?h.f.materialIndex:0]:m}
function tapTool(e){setRay(e);
 if(st.tool==='select'){const j=markerHit();if(j){select(j,true);return}const h=hit();if(!h||h.o===ground){select(null);return}select(rootOf(h.o)||h.o);return}
 const h=hit();if(!h){return}
 if(st.tool==='pipette'){const c=matAt(h).color;st.hsv=rgb2hsv(c.r,c.g,c.b);updateColorUI();toast('Цвет взят: #'+c.getHexString());setTool(st.last==='pipette'?'brush':st.last);return}
 if(st.tool==='fill'){const o=h.o;if(o.isInstancedMesh||o===ground){const m=o.material,old=m.color.clone();m.color.copy(curColor());push(()=>m.color.copy(old))}
  else{const old=o.material;let nm;if(Array.isArray(old)){nm=old.slice();const i=h.f.materialIndex;nm[i]=old[i].clone();nm[i].map=null;nm[i].color.copy(curColor())}else{nm=old.clone();nm.map=null;nm.color.copy(curColor())}o.material=nm;push(()=>{o.material=old})}
  useColor();return}
 if(st.tool==='erase'){const o=h.o;if(o.isInstancedMesh){const r=rootOf(o);if(r===o)removeItem(o);else{const par=o.parent;par.remove(o);const i=strokes.indexOf(o);if(i>=0)strokes.splice(i,1);push(()=>{par.add(o);strokes.push(o)})}}else toast('Ластик стирает мазки. Предметы удаляются кнопкой 🗑')}}
cv.addEventListener('pointerdown',e=>{pointers.add(e.pointerId);if(pointers.size>1){cur=null;return}
 down={x:e.clientX,y:e.clientY,t:performance.now(),ok:!(tc.axis&&sel&&st.tool==='select')};
 if(st.tool==='brush'||st.tool==='paint')brushStart(e)});
cv.addEventListener('pointermove',e=>{if(!cur||pointers.size!==1)return;setRay(e);const s=samplePoint();if(s)brushAdd(e,s)});
const up=e=>{pointers.delete(e.pointerId);if(cur){brushEnd();return}
 if(down&&down.ok&&pointers.size===0&&st.tool!=='brush'&&st.tool!=='paint'&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<9&&performance.now()-down.t<500)tapTool(e);if(!pointers.size)down=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);cur=null});
const TOOLS=[['select','☝','Выбрать'],['brush','🖌','Кисть'],['paint','🖍','Краска'],['fill','🪣','Заливка'],['pipette','💧','Пипетка'],['erase','🧽','Ластик']];

function trackables(){const a=[];items.forEach(it=>{a.push(it);it.traverse(o=>{if(o!==it&&!o.userData.marker&&(o.isBone||o.userData.joint))a.push(o)})});return a}
function snapshot(){const s={};trackables().forEach(o=>{s[o.uuid]=[o.position.x,o.position.y,o.position.z,o.quaternion.x,o.quaternion.y,o.quaternion.z,o.quaternion.w,o.scale.x,o.scale.y,o.scale.z]});return s}
const q1=new T.Quaternion(),q2=new T.Quaternion();
function applyKeys(t){const K=st.keys;if(!K.length)return;let i=0;while(i<K.length-1&&K[i+1].t<=t)i++;const a=K[i],b=K[i+1],f=b?Math.min(1,Math.max(0,(t-a.t)/(b.t-a.t||1))):0,nodes={};trackables().forEach(o=>nodes[o.uuid]=o);
 for(const id in a.s){const o=nodes[id];if(!o)continue;const A=a.s[id],Bv=b&&b.s[id]||A;o.position.set(A[0]+(Bv[0]-A[0])*f,A[1]+(Bv[1]-A[1])*f,A[2]+(Bv[2]-A[2])*f);
  q1.set(A[3],A[4],A[5],A[6]);q2.set(Bv[3],Bv[4],Bv[5],Bv[6]);o.quaternion.copy(q1.slerp(q2,f));o.scale.set(A[7]+(Bv[7]-A[7])*f,A[8]+(Bv[8]-A[8])*f,A[9]+(Bv[9]-A[9])*f)}}
function addKey(){const t=Math.round(st.Tm*100)/100,ex=st.keys.find(k=>Math.abs(k.t-t)<.05);if(ex)ex.s=snapshot();else{st.keys.push({t,s:snapshot()});st.keys.sort((a,b)=>a.t-b.t)}renderAnimDyn();toast('Кадр сохранён на '+t.toFixed(2)+' с')}

 if(T0==='human'){set('legL',s*.7);set('legR',-s*.7);set('kneeL',Math.max(0,-s)*.9);set('kneeR',Math.max(0,s)*.9);set('armL',-s*.6);set('armR',s*.6);set('elL',-.3-Math.max(0,s)*.4);set('elR',-.3-Math.max(0,-s)*.4)}

 if(st.playing){st.Tm+=dt;if(st.Tm>st.dur){if(st.loop)st.Tm=0;else{st.Tm=st.dur;st.playing=false;syncPlay()}}applyKeys(st.Tm);syncTime()}

function syncPlay(){$('#pl').textContent=st.playing?'⏸':'▶'}
function syncTime(){$('#tr').value=st.Tm/st.dur*4000;$('#tl').textContent=st.Tm.toFixed(2)+' с'}

/* цветовой круг */
const wheel=$('#wheel');
function drawWheel(){const x=wheel.getContext('2d'),n=200,im=x.createImageData(n,n),R=n/2;for(let j=0;j<n;j++)for(let i=0;i<n;i++){const dx=i-R+.5,dy=j-R+.5,d=Math.hypot(dx,dy),o=(j*n+i)*4;if(d>R){continue}let h=Math.atan2(dy,dx)*180/Math.PI;if(h<0)h+=360;const[r,g,b]=hsv2rgb(h,d/R,st.hsv[2]);im.data[o]=r*255;im.data[o+1]=g*255;im.data[o+2]=b*255;im.data[o+3]=255}x.putImageData(im,0,0)}
function updateColorUI(){const[h,s,v]=st.hsv,a=h*Math.PI/180;$('#wm').style.left=(50+Math.cos(a)*s*50)+'%';$('#wm').style.top=(50+Math.sin(a)*s*50)+'%';$('#prev').style.background=curHex();$('#hexin').value=curHex();$('#vr').value=Math.round(v*100);drawWheel()}
function wheelPick(e){const r=wheel.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width*2-1,dy=(e.clientY-r.top)/r.height*2-1;let h=Math.atan2(dy,dx)*180/Math.PI;if(h<0)h+=360;st.hsv=[h,Math.min(1,Math.hypot(dx,dy)),st.hsv[2]];updateColorUI()}
let wd=false;wheel.addEventListener('pointerdown',e=>{wd=true;wheel.setPointerCapture(e.pointerId);wheelPick(e)});wheel.addEventListener('pointermove',e=>{if(wd)wheelPick(e)});wheel.addEventListener('pointerup',()=>wd=false);
const PAL=['#e5484d','#ff8a3d','#ffd36b','#a3e635','#34d399','#22d3ee','#3b82f6','#8b5cf6','#ec4899','#ffffff','#9ca3af','#3b2519','#f2c9a5','#14102c'];
function setHex(h){const c=new T.Color(h);st.hsv=rgb2hsv(c.r,c.g,c.b);updateColorUI()}
function renderSw(){const mk=a=>a.map(h=>`<button style="background:${h}" data-a="sw" data-v="${h}"></button>`).join('');$('#recent').innerHTML=mk(st.recent)||'<span class="note">появятся после рисования</span>';$('#presets').innerHTML=mk(PAL)}

/* события панелей */
pb.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 switch(a){
 case'cat':st.cat=v;renderLib();break;case'add':addFromLib(v);break;case'upload':$('#file').click();break;case'city':fillCity();break;case'clouds':addClouds();break;
 case'shape':addShape(+v);break;case'lamp':addLamp();break;case'sz':st.size=Math.min(1,Math.max(0,sizeFor(+v)));renderBrush();break;
 case'sw':setHex(v);break;case'pip':setTool('pipette');break;
 case'newlayer':st.layers.push({id:st.nid,name:'Слой '+st.nid,merge:true,vis:true});st.layer=st.nid++;renderLayers();break;
 case'actl':st.layer=+v;renderLayers();break;
 case'lmode':{const l=st.layers.find(l=>l.id==v);l.merge=!l.merge;renderLayers();break}
 case'leye':{const l=st.layers.find(l=>l.id==v);l.vis=!l.vis;strokes.forEach(s=>{if(s.userData.layer===l.id)s.visible=l.vis});renderLayers();break}
 case'ldel':{if(st.layers.length<2){toast('Нужен хотя бы один слой');break}strokes.slice().forEach(s=>{if(s.userData.layer==+v){if(s.userData.isItem)removeItem(s,true);else s.parent&&s.parent.remove(s);strokes.splice(strokes.indexOf(s),1)}});st.layers=st.layers.filter(l=>l.id!=+v);if(st.layer==+v)st.layer=st.layers[0].id;renderLayers();break}
 case'bake':bake(+v);break;
 case'osel':select(items[+v]);break;case'ohide':items[+v].visible=!items[+v].visible;renderLayers();break;case'odup':dup(items[+v]);break;case'odel':removeItem(items[+v]);break;
 case'lp':Object.assign(st.light,PRE[+v]);applyLight();renderLight();break;
 case'play':if(!st.keys.length){toast('Сначала поставь хотя бы 2 кадра');break}st.playing=!st.playing;if(st.playing&&st.Tm>=st.dur)st.Tm=0;syncPlay();break;
 case'key':addKey();break;
 case'keydel':{const i=st.keys.findIndex(k=>Math.abs(k.t-st.Tm)<.1);if(i>=0){st.keys.splice(i,1);renderAnimDyn()}else toast('Встань на кадр (коснись его времени) и нажми ещё раз');break}
 case'loop':st.loop=!st.loop;b.classList.toggle('on',st.loop);break;
 case'jump':st.Tm=st.keys[+v].t;applyKeys(st.Tm);syncTime();renderAnimDyn();break;
 case'walk':{const r=rootOf(sel);if(!r)break;r.userData.walkOn=!r.userData.walkOn;if(!r.userData.walkOn){walkReset(r);mixers.get(r)&&mixers.get(r).stopAllAction()}
  else{const cl=clipsOf.get(r)||[],c=cl.find(c=>/walk/i.test(c.name))||cl.find(c=>/run|gallop|fly|flap/i.test(c.name));if(c)playClip(r,c.name)}renderAnimDyn();break}
 case'clip':{const r=rootOf(sel);if(r)playClip(r,v);break}
 case'clipstop':{const r=rootOf(sel);if(r&&mixers.get(r))mixers.get(r).stopAllAction();break}}});
pb.addEventListener('input',e=>{const t=e.target,k=t.dataset.i;if(!k)return;const v=t.type==='checkbox'?t.checked:t.value,L=st.light;
 if(k==='size'){st.size=v/1000;renderBrush()}else if(k==='smooth')st.smooth=v/100;else if(k==='press')st.press=v;
 else if(k==='hex'){if(/^#[0-9a-f]{6}$/i.test(v))setHex(v)}else if(k==='v'){st.hsv[2]=v/100;updateColorUI()}
 else if(k==='T'){st.Tm=v/4000*st.dur;applyKeys(st.Tm);$('#tl').textContent=st.Tm.toFixed(2)+' с'}
 else if(k==='dur'){st.dur=+v;st.Tm=Math.min(st.Tm,st.dur);syncTime()}
 else if(k==='speed'){const r=rootOf(sel);if(r)r.userData.speed=v/100}
 else if(['az','el'].includes(k)){L[k]=+v;applyLight()}else if(k==='int'||k==='hemi'){L[k]=v/100;applyLight()}else if(['shadow','ground','grid'].includes(k)){st[k]=v;applyLight()}});
function bake(id){const ss=strokes.filter(s=>s.userData.layer===id&&s.userData.isItem);if(!ss.length)return;const bx=new T.Box3();ss.forEach(s=>bx.expandByObject(s));const g=new T.Group();g.position.copy(bx.getCenter(new T.Vector3()));scene.add(g);
 ss.forEach(s=>{items.splice(items.indexOf(s),1);s.userData.isItem=false;g.attach(s)});g.userData.isItem=true;g.userData.name='Предмет из слоя';items.push(g);select(g);push(()=>removeItem(g,true));renderAll();toast('Мазки склеены в один предмет')}

/* ---------- гид ---------- */
const GUIDE={
 char:[['Возьми героя','Открой «Библиотека» внизу и коснись фигурки: человек, чиби, кот, собака, лиса. Во вкладке «Из интернета» — готовые 3D-модели. Можно загрузить свой .glb.'],
  ['Покрась','Вкладка «Цвет»: води пальцем по кругу — это цвет, ползунок — яркость. Инструмент 🪣 красит всю часть, 🖍 кладёт слой краски, 🖌 рисует объёмом, 💧 берёт цвет с модели.'],
  ['Дострой','«Фигуры» — куб, шар, конус и другие: двигай их рамкой и собирай хоть шлем, хоть хвост. Кисть тонкая как усы или толстая как рукоять — размер меняй во вкладке «Кисть».'],
  ['Слои','«Слитый» слой: мазок прирастает к тому, чего коснулся, и двигается вместе с ним. «Отдельный»: мазок — самостоятельная вещь. Потом нажми «Анимация» сверху.']],
 item:[['Начни с фигур','Вкладка «Фигуры»: добавь куб, цилиндр, шар. Тяни рамку: ↔ двигать, ⟳ крутить, ⤢ менять размер. Рамка в панели над картинкой справа.'],
  ['Дорисуй кистью','Кисть 🖌: один палец рисует, двумя крутишь и приближаешь. Пресеты «Усы» … «Кувалда» дают нужную толщину, а ползунок — любую.'],
  ['Слои','На «отдельном» слое мазки — самостоятельные вещи. Нажми «Склеить мазки слоя в один предмет» — и рукоять из мазков станет одним предметом.'],
  ['В игру','Кнопка ⬇ сверху сохранит всё в файл .glb — он открывается в любых игровых движках.']],
 loc:[['Построй город','Библиотека → «Город»: многоэтажки, дом, авто, фургон, дорога, трубы, фонарь, забор. Кнопка «Собрать город сразу» ставит целый квартал.'],
  ['Небо и природа','Вкладка «Природа»: облака, деревья, ёлки, камни, горы. Облака сами повисают в воздухе.'],
  ['Двигай','Коснись предмета (☝) — появится рамка. ↔ двигать, ⟳ крутить, ⤢ размер, ⧉ копия, 🗑 убрать.'],
  ['Свет','Вкладка «Свет»: день, закат, ночь, тени. Кнопка «Лампа» ставит светящийся шар в нужном месте.']],
 anim:[['Суставы','Коснись зелёного шарика на модели 🦴 — появится кольцо. Потяни его, сустав повернётся. Не видишь шариков — нажми 🦴 в панели справа сверху.'],
  ['Кадры','Передвинь ползунок времени, поставь позу и нажми «＋ Кадр». Потом выбери другое время, смени позу и снова «＋ Кадр». Предметы можно двигать тоже.'],
  ['Смотри','▶ запускает анимацию, 🔁 — повтор. Коснись времени кадра, чтобы вернуться к нему.'],
  ['Ходьба и движения','Коснись персонажа: кнопка «Ходьба» сама двигает ноги и ведёт вперёд. У моделей из интернета есть свои движения — выбери в списке.']]};
function guide(m,force){const k='qw_g_'+m;try{if(!force&&localStorage.getItem(k))return}catch(e){}const S=GUIDE[m];let i=0;const ov=$('#guide');
 const draw=()=>{ov.innerHTML=`<div class="gc"><div class="gstep">${i+1} из ${S.length}</div><h3>${S[i][0]}</h3><p>${S[i][1]}</p><div class="grow"><button data-g="skip">Закрыть</button><button class="on" data-g="next">${i<S.length-1?'Дальше':'Понятно'}</button></div></div>`};
 ov.onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;if(b.dataset.g==='next'&&i<S.length-1){i++;draw();return}ov.style.display='none';try{localStorage.setItem(k,'1')}catch(e){}};
 ov.style.display='flex';draw()}
$('#resetg').onclick=()=>{try{Object.keys(GUIDE).forEach(m=>localStorage.removeItem('qw_g_'+m))}catch(e){}toast('Подсказки покажутся снова при входе')};

/* ---------- экспорт ---------- */
function exportGLB(){if(!items.length||!window.THREE.GLTFExporter){toast('Сначала добавь что-нибудь');return}
 tc.detach();const restore=[],exp=[];
 items.forEach(it=>{if(it.visible===false)return;const inst=[];if(it.isInstancedMesh)inst.push(it);it.traverse(o=>{if(o!==it&&o.isInstancedMesh)inst.push(o)});
  const mk=o=>{const gs=[],m4=new T.Matrix4();for(let i=0;i<o.count;i++){o.getMatrixAt(i,m4);gs.push(o.geometry.clone().applyMatrix4(m4))}const st2=new T.Mesh(T.BufferGeometryUtils.mergeBufferGeometries(gs),o.material);st2.matrix.copy(o.matrix);st2.matrix.decompose(st2.position,st2.quaternion,st2.scale);return st2};
  inst.forEach(o=>{const s2=mk(o);(o.parent||scene).add(s2);o.visible=false;restore.push(()=>{s2.parent.remove(s2);o.visible=true})});
  exp.push(it.isInstancedMesh?restore.length&&it:it)});
 const fin=exp.map(o=>{if(!o.isInstancedMesh)return o;const r=scene.children[scene.children.length-1];return r});
 const hid=[];items.forEach(it=>it.traverse(o=>{if(o.userData.marker&&o.visible){o.visible=false;hid.push(o)}}));
 const anims=[];items.forEach(it=>(clipsOf.get(it)||[]).forEach(c=>anims.push(c)));
 const done=r=>{hid.forEach(o=>o.visible=true);restore.forEach(f=>f());const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'model/gltf-binary'}));a.download='qwerty.glb';a.click();toast('Сохранено: qwerty.glb')};
 const fail=()=>{hid.forEach(o=>o.visible=true);restore.forEach(f=>f());toast('Не получилось сохранить')};
 try{const ex=new T.GLTFExporter(),opt={binary:true,onlyVisible:true,animations:anims,trs:false};const root=new T.Group();
  const clones=[];fin.forEach(o=>{if(o.parent===scene||!o.parent)clones.push(o)});
  if(ex.parse.length>=4)ex.parse(clones,done,fail,opt);else ex.parse(clones,done,opt)}catch(e){fail()}}

/* ---------- запуск ---------- */
function enter(m){st.mode=m;const M=MODES[m];$('#home').style.display='none';$('#ed').style.display='block';resize();
 $('#modes').innerHTML=Object.keys(MODES).map(k=>`<button data-m="${k}" class="${k===m?'on':''}">${MODES[k].s}</button>`).join('');
 $('#tabs').innerHTML=M.tabs.map(t=>`<button data-tab="${t}">${TABS[t][0]} ${TABS[t][1]}</button>`).join('');
 st.cat=M.cat;showTab.force=1;showTab(M.tabs[0]);setTool('select');toast(M.t);
 if(m==='loc'){camera.position.set(11,8,13);controls.target.set(0,1,0)}else if(m!=='anim'){camera.position.set(3.2,2.4,4.2);controls.target.set(0,.9,0)}
 setJoints(m==='anim'||m==='char');renderSw();updateColorUI();applyLight();guide(m)}
$('#modes').onclick=e=>{const b=e.target.closest('[data-m]');if(b)enter(b.dataset.m)};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)};
$$('.hc').forEach(b=>b.onclick=()=>enter(b.dataset.m));
$('#bhome').onclick=()=>{$('#ed').style.display='none';$('#home').style.display='block';st.playing=false};
$('#bundo').onclick=()=>{const f=undoS.pop();if(f){f();renderAll()}else toast('Откатывать нечего')};
$('#bhelp').onclick=()=>guide(st.mode,true);
$('#bexp').onclick=exportGLB;
renderSw();applyLight();tick();
})();
</script></body></html>
