<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Аниматор</title>
<style>
  :root {
    --ink: #16131f;
    --panel: #201b30;
    --paper: #ece9f5;
    --mag: #ff2e88;
    --cy: #27e0d0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    height: 100dvh;
    display: grid;
    grid-template-columns: 1fr 290px;
    background: var(--ink);
    color: var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }

  /* сцена */
  #stage { position: relative; min-width: 0; min-height: 0; }
  #stage::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle, var(--mag) 1.6px, transparent 2px) 0 0 / 16px 16px;
    opacity: .45;
    -webkit-mask-image: radial-gradient(ellipse at 50% 55%, transparent 28%, #000 92%);
            mask-image: radial-gradient(ellipse at 50% 55%, transparent 28%, #000 92%);
  }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* панель */
  #panel {
    margin: 10px 14px 10px 4px;
    padding: 10px;
    background: var(--panel);
    border: 2px solid var(--paper);
    box-shadow: -5px 5px 0 var(--mag);
    border-radius: 4px;
    overflow-y: auto;
    min-height: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    flex: 1 1 auto;
    min-height: 38px;
    padding: 0 10px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--paper);
    border: 2px solid var(--paper);
    border-radius: 4px;
    font: inherit; font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .btn:active { background: var(--cy); color: var(--ink); border-color: var(--cy); }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--cy); outline-offset: 2px; }
  #status { min-height: 18px; color: var(--cy); font-size: 13px; }
  #status.err { color: var(--mag); }
  .opt { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .opt input { width: 20px; height: 20px; accent-color: var(--mag); }

  #parts { display: flex; flex-direction: column; gap: 4px; }
  .part {
    display: grid; grid-template-columns: 1fr 40px 84px; gap: 6px; align-items: center;
    padding: 4px 0;
    border-top: 1px solid rgba(236,233,245,.18);
  }
  .part.off .name { opacity: .4; text-decoration: line-through; }
  .name { overflow-wrap: anywhere; line-height: 1.2; }
  .part input[type=color] {
    width: 40px; height: 34px; padding: 0;
    background: none; border: 2px solid var(--paper); border-radius: 4px;
  }
  .part .btn { min-height: 34px; padding: 0 6px; font-size: 13px; }

  /* вертикальный экран: панель снизу */
  @media (max-aspect-ratio: 1/1) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(0, 42dvh); }
    #panel { margin: 0 14px 14px 10px; box-shadow: 5px 5px 0 var(--mag); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
  <div id="stage"><canvas id="view"></canvas></div>

  <aside id="panel">
    <div class="row">
      <label class="btn">Своя модель<input id="file" type="file" accept=".vrm,.glb" hidden></label>
      <button class="btn" id="reset" type="button">Сбросить</button>
    </div>
    <div class="row">
      <button class="btn" id="camFull" type="button">Весь рост</button>
      <button class="btn" id="camFace" type="button">Лицо</button>
    </div>
    <label class="opt"><input type="checkbox" id="fill" checked>Красить сплошным цветом</label>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="parts"></div>
  </aside>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const SAMPLE_URL = 'https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm';

const stage = document.getElementById('stage');
const canvas = document.getElementById('view');
const statusEl = document.getElementById('status');
const partsEl = document.getElementById('parts');
const fillEl = document.getElementById('fill');

function say(text, isErr = false) {
  statusEl.textContent = text;
  statusEl.className = isErr ? 'err' : '';
}

/* --- сцена --- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
camera.position.set(0, 1, 3);

const light = new THREE.DirectionalLight(0xffffff, Math.PI);
light.position.set(1, 1.2, 1.5);
scene.add(light);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 8;
controls.target.set(0, 1, 0);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

/* --- модель --- */
const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

let vrm = null;
let parts = [];

function cleanName(raw) {
  return (raw || 'Часть')
    .replace(/\s*\(Instance\)/g, '')
    .replace(/^N\d+_\d+_\d+_/, '')
    .replace(/_/g, ' ')
    .trim();
}

function collectParts() {
  parts = [];
  const byMat = new Map();
  vrm.scene.traverse(obj => {
    if (!obj.isMesh) return;
    obj.frustumCulled = false;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    const main = mats.find(m => !m.isOutline) || mats[0];
    let p = byMat.get(main);
    if (!p) {
      p = {
        name: cleanName(main.name || obj.name),
        mat: main,
        meshes: [],
        hidden: false,
        colored: false,
        origColor: main.color ? main.color.clone() : null,
        origShade: main.shadeColorFactor ? main.shadeColorFactor.clone() : null,
        origMap: main.map || null,
        origShadeTex: main.shadeMultiplyTexture || null
      };
      byMat.set(main, p);
      parts.push(p);
    }
    p.meshes.push(obj);
  });
}

function syncTextures(p) {
  if (!p.colored) return;
  const m = p.mat;
  const flat = fillEl.checked;
  const map = flat ? null : p.origMap;
  if (m.map !== map) { m.map = map; m.needsUpdate = true; }
  if ('shadeMultiplyTexture' in m) {
    const st = flat ? null : p.origShadeTex;
    if (m.shadeMultiplyTexture !== st) { m.shadeMultiplyTexture = st; m.needsUpdate = true; }
  }
}

function paint(p, hex) {
  p.colored = true;
  p.mat.color.set(hex);
  if (p.mat.shadeColorFactor) p.mat.shadeColorFactor.copy(p.mat.color).multiplyScalar(0.7);
  syncTextures(p);
}

function setHidden(p, hidden) {
  p.hidden = hidden;
  p.meshes.forEach(m => { m.visible = !hidden; });
}

function restore(p) {
  const m = p.mat;
  if (p.origColor) m.color.copy(p.origColor);
  if (p.origShade && m.shadeColorFactor) m.shadeColorFactor.copy(p.origShade);
  if ('map' in m) m.map = p.origMap;
  if ('shadeMultiplyTexture' in m) m.shadeMultiplyTexture = p.origShadeTex;
  m.needsUpdate = true;
  p.colored = false;
  setHidden(p, false);
}

function buildPanel() {
  partsEl.innerHTML = '';
  parts.forEach(p => {
    const row = document.createElement('div');
    row.className = 'part';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = p.name;
    row.appendChild(name);

    if (p.mat.color) {
      const input = document.createElement('input');
      input.type = 'color';
      input.value = '#' + p.mat.color.getHexString();
      input.setAttribute('aria-label', 'Цвет: ' + p.name);
      input.addEventListener('input', () => paint(p, input.value));
      row.appendChild(input);
    } else {
      row.appendChild(document.createElement('span'));
    }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = 'Скрыть';
    btn.addEventListener('click', () => {
      setHidden(p, !p.hidden);
      btn.textContent = p.hidden ? 'Показать' : 'Скрыть';
      row.classList.toggle('off', p.hidden);
    });
    row.appendChild(btn);

    partsEl.appendChild(row);
  });
}

function setPose() {
  const h = vrm.humanoid;
  const l = h.getNormalizedBoneNode('leftUpperArm');
  const r = h.getNormalizedBoneNode('rightUpperArm');
  if (l) l.rotation.z = -1.15;
  if (r) r.rotation.z = 1.15;
}

/* --- камера --- */
function frameFull() {
  if (!vrm) return;
  const box = new THREE.Box3().setFromObject(vrm.scene);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const fov = camera.fov * Math.PI / 180;
  const d = (size.y / 2) / Math.tan(fov / 2) * 1.25;
  controls.target.copy(c);
  camera.position.set(c.x, c.y, c.z + d);
  controls.update();
}

function frameFace() {
  if (!vrm) return;
  const head = vrm.humanoid.getNormalizedBoneNode('head');
  if (!head) return;
  const p = head.getWorldPosition(new THREE.Vector3());
  p.y += 0.06;
  controls.target.copy(p);
  camera.position.set(p.x, p.y, p.z + 0.75);
  controls.update();
}

/* --- загрузка --- */
async function loadModel(url) {
  say('Загружаю модель…');
  try {
    const gltf = await loader.loadAsync(url);
    const next = gltf.userData.vrm;
    if (!next) throw new Error('В файле нет VRM-данных');
    if (vrm) {
      scene.remove(vrm.scene);
      VRMUtils.deepDispose(vrm.scene);
    }
    vrm = next;
    VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);
    setPose();
    collectParts();
    buildPanel();
    vrm.update(0);
    frameFull();
    say('Готово. Частей: ' + parts.length);
  } catch (e) {
    console.error(e);
    say('Не получилось загрузить. Выбери .vrm через «Своя модель».', true);
  }
}

/* --- кнопки --- */
document.getElementById('camFull').addEventListener('click', frameFull);
document.getElementById('camFace').addEventListener('click', frameFace);
fillEl.addEventListener('change', () => parts.forEach(syncTextures));
document.getElementById('reset').addEventListener('click', () => {
  parts.forEach(restore);
  buildPanel();
  say('Цвета и видимость сброшены');
});
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  loadModel(url).finally(() => URL.revokeObjectURL(url));
  e.target.value = '';
});

/* --- цикл --- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (vrm) vrm.update(dt);
  controls.update();
  renderer.render(scene, camera);
});

loadModel(SAMPLE_URL);
</script>
</body>
</html>
